# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: preventai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Free AI. Paste your key in the Render dashboard when asked (never commit it).
      - key: GEMINI_API_KEY
        sync: false
